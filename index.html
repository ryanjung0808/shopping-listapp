<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쇼핑 리스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: #5a67d8;
            color: white;
            padding: 24px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .input-section {
            padding: 20px;
            background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #itemInput {
            flex: 1;
            padding: 14px 18px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
        }

        #itemInput:focus {
            border-color: #5a67d8;
        }

        #addBtn {
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: #5a67d8;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        #addBtn:hover {
            background: #4c51bf;
        }

        #addBtn:active {
            transform: scale(0.95);
        }

        .list-section {
            padding: 10px 20px 20px;
            min-height: 200px;
        }

        .empty-message {
            text-align: center;
            color: #a0aec0;
            padding: 60px 20px;
            font-size: 1.1rem;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            padding: 16px;
            margin: 10px 0;
            background: #f7fafc;
            border-radius: 10px;
            transition: all 0.2s;
        }

        li:hover {
            background: #edf2f7;
        }

        li.checked {
            background: #c6f6d5;
        }

        li.checked .item-text {
            text-decoration: line-through;
            color: #718096;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #cbd5e0;
            border-radius: 6px;
            margin-right: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .checkbox:hover {
            border-color: #5a67d8;
        }

        li.checked .checkbox {
            background: #48bb78;
            border-color: #48bb78;
        }

        .checkbox::after {
            content: '';
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            opacity: 0;
        }

        li.checked .checkbox::after {
            opacity: 1;
        }

        .item-text {
            flex: 1;
            font-size: 1.05rem;
            color: #2d3748;
        }

        .delete-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #a0aec0;
            font-size: 1.4rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: #fed7d7;
            color: #e53e3e;
        }

        .stats {
            padding: 16px 20px;
            background: #f7fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            color: #718096;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>쇼핑 리스트</h1>
        </header>

        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="itemInput" placeholder="아이템을 입력하세요" autocomplete="off">
                <button id="addBtn">추가</button>
            </div>
        </div>

        <div class="list-section">
            <ul id="shoppingList"></ul>
        </div>

        <div class="stats">
            <span id="totalCount">총 0개</span>
            <span id="checkedCount">완료 0개</span>
        </div>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Supabase 설정
        const SUPABASE_URL = 'https://azyyheojwborzujspslg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6eXloZW9qd2Jvcnp1anNwc2xnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MjgxMzksImV4cCI6MjA4NDEwNDEzOX0.q-uuhgwlc4EwhdBOXuWfcS2GVWTWIQogGzdDWkn6R-o';

        const { createClient } = window.supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const itemInput = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const shoppingList = document.getElementById('shoppingList');
        const totalCount = document.getElementById('totalCount');
        const checkedCount = document.getElementById('checkedCount');

        let items = [];

        // Supabase에서 아이템 불러오기
        async function loadItems() {
            const { data, error } = await supabaseClient
                .from('shopping_items')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Error loading items:', error);
                return;
            }

            items = data || [];
            renderList();
        }

        function updateStats() {
            const total = items.length;
            const checked = items.filter(item => item.checked).length;
            totalCount.textContent = `총 ${total}개`;
            checkedCount.textContent = `완료 ${checked}개`;
        }

        function renderList() {
            if (items.length === 0) {
                shoppingList.innerHTML = '<div class="empty-message">리스트가 비어있습니다</div>';
            } else {
                shoppingList.innerHTML = items.map((item) => `
                    <li class="${item.checked ? 'checked' : ''}" data-id="${item.id}">
                        <div class="checkbox" onclick="toggleCheck('${item.id}')"></div>
                        <span class="item-text">${escapeHtml(item.text)}</span>
                        <button class="delete-btn" onclick="deleteItem('${item.id}')">×</button>
                    </li>
                `).join('');
            }
            updateStats();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function addItem() {
            const text = itemInput.value.trim();
            if (text) {
                const { data, error } = await supabaseClient
                    .from('shopping_items')
                    .insert([{ text, checked: false }])
                    .select();

                if (error) {
                    console.error('Error adding item:', error);
                    return;
                }

                if (data && data[0]) {
                    items.push(data[0]);
                    renderList();
                }

                itemInput.value = '';
                itemInput.focus();
            }
        }

        async function deleteItem(id) {
            const { error } = await supabaseClient
                .from('shopping_items')
                .delete()
                .eq('id', id);

            if (error) {
                console.error('Error deleting item:', error);
                return;
            }

            items = items.filter(item => item.id !== id);
            renderList();
        }

        async function toggleCheck(id) {
            const item = items.find(item => item.id === id);
            if (!item) return;

            const newChecked = !item.checked;

            const { error } = await supabaseClient
                .from('shopping_items')
                .update({ checked: newChecked, updated_at: new Date().toISOString() })
                .eq('id', id);

            if (error) {
                console.error('Error updating item:', error);
                return;
            }

            item.checked = newChecked;
            renderList();
        }

        addBtn.addEventListener('click', addItem);
        itemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addItem();
        });

        // 초기 로드
        loadItems();
    </script>
</body>
</html>
